name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Luna.slnx -c Release

      - name: Publish
        run: dotnet publish src/Luna/Luna.csproj -c Release -r win-x64 -o out

      - uses: actions/upload-artifact@v4
        with:
          name: Luna
          path: out/Luna.exe
